# ============================================================
# Loan Performance Intelligence Engine — Central Config
# All hyperparameters, paths, and settings in one place.
# No magic numbers in source code.
# ============================================================

# ── Reproducibility ─────────────────────────────────────────
random_seed: 42

# ── Paths ───────────────────────────────────────────────────
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  external_dir: data/external
  models_dir: models
  outputs_dir: outputs
  reports_dir: reports

  # Organizer-provided files
  train_file: data/raw/loan_monthly_performance_train.csv
  test_file: data/raw/loan_monthly_performance_test.csv
  static_file: data/raw/loan_static_attributes.csv
  servicer_file: data/raw/servicer_updates.csv
  macro_file: data/raw/macro_scenarios.csv
  submission_template: data/raw/submission_template.csv
  data_dictionary: data/raw/data_dictionary.md
  validation_rules: data/raw/validation_rules.json

  # Processed outputs
  train_features: data/processed/train_features.parquet
  test_features: data/processed/test_features.parquet
  dq_scores: data/processed/dq_scores.parquet

  # LLM audit log
  llm_audit_log: outputs/llm_logs/audit.jsonl
  hitl_decisions: outputs/hitl_decisions.csv

# ── Schema: expected dtypes for monthly performance ─────────
schema:
  loan_id: str
  month_index: int
  reporting_month: str          # YYYY-MM
  origination_month: str        # YYYY-MM
  loan_age_months: int
  remaining_term_months: int
  original_balance: float
  current_balance: float
  interest_rate: float
  credit_score_band: str
  ltv_band: str
  dti_band: str
  state: str
  loan_purpose: str
  occupancy_type: str
  property_type: str
  servicer_name: str
  current_status: str
  days_past_due: int
  modification_flag: int
  prepayment_flag: int
  default_flag: int
  loss_severity_band: str
  last_updated_at: str
  source_system: str
  document_status: str

# ── Target columns ──────────────────────────────────────────
targets:
  delinquency_3m: next_3m_delinquency_flag
  delinquency_6m: next_6m_delinquency_flag
  default_12m: next_12m_default_flag
  prepayment_12m: next_12m_prepayment_flag
  next_state: next_state
  exception_required: exception_required
  exception_type: exception_type

# ── Data Quality Scoring ────────────────────────────────────
dq_scoring:
  critical_columns:
    - current_balance
    - days_past_due
    - current_status
    - original_balance
    - loan_age_months
  optional_columns:
    - document_status
    - source_system
    - loss_severity_band
  weights:
    missing_critical: 15
    missing_optional: 5
    outlier_flag: 10
    cross_col_contradiction: 5
    servicer_conflict: 5
    staleness_flag: 5
  thresholds:
    red_flag: 50
    yellow_flag: 75

# ── Temporal Split ──────────────────────────────────────────
temporal_split:
  # Number of months before the last training month to set as cutoff
  # This ensures 12m targets can be properly constructed
  holdout_months: 15
  validation_months: 3
  min_train_months: 24

# ── Feature Engineering ─────────────────────────────────────
features:
  lag_periods: [1, 3, 6]
  rolling_windows: [3, 6, 12]
  staleness_threshold_days: 90

  # Categorical columns for target encoding
  target_encode_cols:
    - servicer_name
    - state

  # Ordinal band mappings
  credit_score_band_order:
    - "<620"
    - "620-639"
    - "640-659"
    - "660-679"
    - "680-699"
    - "700-719"
    - "720-739"
    - "740-759"
    - "760-779"
    - "780+"

  ltv_band_order:
    - "0-60"
    - "60-70"
    - "70-75"
    - "75-80"
    - "80-85"
    - "85-90"
    - "90-95"
    - "95-97"
    - "97+"

  dti_band_order:
    - "0-20"
    - "20-30"
    - "30-36"
    - "36-43"
    - "43-45"
    - "45+"

# ── Model Hyperparameters ────────────────────────────────────
models:
  delinquency_3m:
    algorithm: lightgbm
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto      # computed from class ratio
    n_jobs: 1
    random_state: 42

  delinquency_6m:
    algorithm: lightgbm
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto
    n_jobs: 1
    random_state: 42

  default_12m:
    algorithm: xgboost
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 10
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto
    eval_metric: aucpr
    tree_method: hist
    n_jobs: 1
    random_state: 42

  prepayment_12m:
    algorithm: lightgbm
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto
    n_jobs: 1
    random_state: 42


  next_state:
    algorithm: lightgbm
    objective: multiclass
    n_estimators: 500
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 63
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    class_weight: balanced
    n_jobs: -1
    random_state: 42

  exception_model:
    algorithm: lightgbm
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 5
    num_leaves: 31
    min_child_samples: 30
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: auto
    n_jobs: -1
    random_state: 42

# ── Optuna Tuning ────────────────────────────────────────────
optuna:
  n_trials: 50
  timeout_seconds: 1800        # 30 minutes per model
  direction: maximize
  metric: aucpr

# ── Anomaly Detection ────────────────────────────────────────
anomaly:
  contamination: 0.05          # expected anomaly rate ~5%
  n_top_examples: 20
  ensemble_weights:
    isolation_forest: 0.4
    lof: 0.3
    hbos: 0.3

# ── Survival Analysis ────────────────────────────────────────
survival:
  duration_col: loan_age_months
  event_col_default: next_12m_default_flag
  event_col_prepay: next_12m_prepayment_flag
  penalizer: 0.1

# ── Scenarios ────────────────────────────────────────────────
scenarios:
  base:
    rate_delta: 0.0
    hpi_delta: 0.0
    unemployment_delta: 0.0
  adverse:
    rate_delta: 3.0            # +300 bps
    hpi_delta: -0.15           # -15%
    unemployment_delta: 4.0    # +4 pp
  high_prepayment:
    rate_delta: -1.5           # -150 bps
    hpi_delta: 0.10            # +10%
    unemployment_delta: 0.0

# ── LLM / RAG ────────────────────────────────────────────────
llm:
  provider: groq               # options: groq | openai | ollama
  groq_model: qwen/qwen3.8-27b
  openai_model: gpt-4o-mini
  ollama_model: mistral:7b
  temperature: 0.0
  max_tokens: 500
  top_k_chunks: 3
  grounding_required: true

  forbidden_phrases:
    - "I predict"
    - "the model will"
    - "I believe the loan will"
    - "I am certain"

# ── Streamlit Dashboard ──────────────────────────────────────
dashboard:
  title: "Loan Performance Intelligence Engine"
  theme: dark
  port: 8501

# ── Submission ───────────────────────────────────────────────
submission:
  output_file: submission.csv
  required_columns:
    - loan_id
    - month_index
    - prob_next_3m_delinquency
    - prob_next_6m_delinquency
    - prob_next_12m_default
    - prob_next_12m_prepayment
    - next_state
    - exception_required
    - exception_type
    - anomaly_score
    - top_drivers
    - action
    - confidence
